version: 2
updates:
  - package-ecosystem: cargo
    directory: "/src-tauri"
    schedule:
      interval: "weekly"
    # Group dependency updates into a single pull request.
    groups:
      dependencies:
        patterns:
          - "*"

  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: "weekly"
    # TypeScript 7 ships no JS compiler API, which @vue/compiler-sfc and vue-tsc load. Hold it back
    # until they support it.
    ignore:
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
    # Group dependency updates into a single pull request.
    groups:
      dependencies:
        patterns:
          - "*"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    # Group dependency updates into a single pull request.
    groups:
      dependencies:
        patterns:
          - "*"
