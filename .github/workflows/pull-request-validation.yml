name: Pull Request Validation

on:
    push:
        branches:
            - main
        paths-ignore:
            - "**.md"
    pull_request:
        paths-ignore:
            - "**.md"

permissions: {}

env:
    CARGO_TERM_COLOR: always
    CARGO_INCREMENTAL: 0
    RUSTFLAGS: -D warnings
    CARGO_PROFILE_TEST_DEBUG: 0

concurrency:
    group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
    cancel-in-progress: true

# Runs the `just verify` gate once, and builds the tauri app on every platform without uploading it anywhere.

jobs:
  verify:
    permissions:
      contents: read
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7

      - name: Install pnpm, Node.js and Frontend Dependencies
        uses: pnpm/setup@v3
        with:
          runtime: node@26.13.1
          cache: true
          require-lockfile: true

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target

      - name: Install just, cargo-nextest and cargo-deny
        uses: taiki-e/install-action@v2
        with:
          tool: just,cargo-nextest,cargo-deny

      # Not in install-action's list; rust-cache keeps ~/.cargo/bin, so this compiles only on a cache miss
      - name: Install sqlx-cli
        run: command -v cargo-sqlx || cargo install sqlx-cli --no-default-features --features sqlite --locked

      - name: Verify
        run: just verify

  test-tauri:
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest # for Arm based macs (M1 and above).
            args: --target aarch64-apple-darwin
          - platform: macos-latest # for Intel based macs.
            args: --target x86_64-apple-darwin
          - platform: ubuntu-22.04
            args: ''
          - platform: ubuntu-22.04-arm # Only available in public repos.
            args: ''
          - platform: windows-latest
            args: ''

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v7

      - name: Install pnpm, Node.js and Frontend Dependencies
        uses: pnpm/setup@v3
        with:
          runtime: node@26.13.1
          cache: true
          require-lockfile: true

      - name: Install Dependencies (Ubuntu only)
        if: matrix.platform == 'ubuntu-22.04' || matrix.platform == 'ubuntu-22.04-arm' # This must match the platform value defined above.
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          # Those targets are only used on macos runners so it's in an `if` to slightly speed up windows and linux builds.
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Rust Cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target

      # If tagName and releaseId are omitted tauri-action will only build the app and won't try to upload any assets.
      - name: Build Artifacts
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: ${{ matrix.args }}
