minimumReleaseAgeExcludePrune: true
minimumReleaseAgeExclude:
  - tauri-plugin-fontgres-api@0.1.0

trustPolicy: no-downgrade
trustPolicyExclude:
  # Oxlint's type-aware backend. Its prereleases trip the trust check, and a new one ships every
  # few days, so it is excluded by name rather than by version.
  - tsrs

shellEmulator: true

# Security fixes pending compatible releases of the parent tooling packages.
overrides:
  # js-beautify and vue-metamorph still request vulnerable glob releases.
  glob@>=9.0.0 <14.0.2: ^14.0.6
  # Older tooling ranges exclude the fixed minimatch major.
  minimatch@>=7.0.0 <11.0.1: ^11.0.8
  # oxfmt 0.35 pins a vulnerable worker pool.
  tinypool@<2.1.2: ^2.2.0

allowBuilds:
  vue-demi: true

onlyBuiltDependencies:
  - "@tailwindcss/oxide"
  - unrs-resolver
  - vue-demi
