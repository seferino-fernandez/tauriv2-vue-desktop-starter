minimumReleaseAgeExcludePrune: true
minimumReleaseAgeExclude:
  - tailwind-merge@3.7.0

trustPolicy: no-downgrade
trustPolicyExclude:
  - chokidar@4.0.3
  - semver@6.3.1

shellEmulator: true

overrides:
  katex@>=0.11.0 <0.18.2: ^0.18.2
  tinypool@<2.1.2: ^2.1.2

allowBuilds:
  vue-demi: true

onlyBuiltDependencies:
  - '@tailwindcss/oxide'
  - unrs-resolver
  - vue-demi
