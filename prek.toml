# prek pre-commit hook configuration
# https://prek.j178.dev

# Priority 0 — Builtin Rust-native hooks (instant, offline, zero setup)
[[repos]]
repo = "builtin"

[[repos.hooks]]
id = "detect-private-key"
priority = 0

[[repos.hooks]]
id = "check-added-large-files"
args = [ "--maxkb=1024" ]
priority = 0

[[repos.hooks]]
id = "check-merge-conflict"
priority = 0

[[repos.hooks]]
id = "trailing-whitespace"
args = [ "--markdown-linebreak-ext=md" ]
priority = 0

[[repos.hooks]]
id = "end-of-file-fixer"
priority = 0

[[repos.hooks]]
id = "mixed-line-ending"
args = [ "--fix=lf" ]
priority = 0

[[repos.hooks]]
id = "check-yaml"
args = [ "--allow-multiple-documents" ]
priority = 0

[[repos.hooks]]
id = "check-toml"
priority = 0

[[repos.hooks]]
id = "check-json"
# .vscode/*.json are JSONC — comments and trailing commas are legal there and
# VS Code reads them that way. A strict JSON parser is simply the wrong tool
# for those three files, so they are excluded rather than the hook weakened.
exclude = "^\\.vscode/"
priority = 0

# Priority 10 — Secret scanning (runs in parallel with linting)
[[repos]]
repo = "https://github.com/gitleaks/gitleaks"
rev = "v8.30.1"
hooks = [ { id = "gitleaks", priority = 10 } ]

# Priority 10 — yamllint (deeper YAML validation)
[[repos]]
repo = "https://github.com/adrienverge/yamllint"
rev = "v1.38.0"
# .github/workflows/ is excluded because those files mix 4-space indentation
# (the `on:` block) with 2-space (the `jobs:` block) — a real inconsistency,
# but CI is out of onboard's scope to reformat. Filed as a backlog row instead
# of silently disabling the indentation rule for every YAML file in the repo.
hooks = [
  { id = "yamllint", args = [
    "-c",
    ".yamllint.yml"
  ], exclude = "^\\.github/workflows/", priority = 10 }
]

# Priority 20 — the project's own gate, through just
[[repos]]
repo = "local"

[[repos.hooks]]
id = "just-format"
name = "just format"
language = "system"
entry = "just format"
pass_filenames = false
always_run = true
priority = 20

[[repos.hooks]]
id = "just-lint"
name = "just lint"
language = "system"
entry = "just lint"
pass_filenames = false
always_run = true
priority = 20
