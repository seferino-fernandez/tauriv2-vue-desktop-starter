[package]
name = "tauriv2-vue-desktop-starter"
version = "0.19.0"
description = "A Tauri v2 Vue Desktop Starter"
license = "MIT"
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "tauriv2_vue_desktop_starter_lib"
crate-type = [
  "staticlib",
  "cdylib",
  "rlib"
]

[build-dependencies]
tauri-build = { version = "2.7.6", features = [] }

[dependencies]
tauri = { version = "2.12.7", features = [] }
tauri-plugin-shell = "2.6.0"
tauri-plugin-window-state = "2.5.0"
tauri-plugin-store = "2.5.1"
tauri-plugin-decorum = "1.1.1"
tauri-plugin-devtools = "2.2.3"
tauri-plugin-log = "2.10.2"
tauri-plugin-fs = "2.7.1"
tauri-plugin-dialog = "2.8.4"
tauri-plugin-pilot = "0.8.1"
tauri-plugin-os = "2.4.0"
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-single-instance = "2.5.5"
fix-path-env = { git = "https://github.com/tauri-apps/fix-path-env-rs", rev = "c4c45d503ea115a839aae718d02f79e7c7f0f673" }

serde_json = "1.0.154"
log = "0.4.35"

[lints.rust]
missing_docs = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }
unreachable_pub = "warn"
unsafe_code = "forbid"
unused_lifetimes = "warn"
unused_qualifications = "warn"

[lints.rustdoc]
bare_urls = "deny"
broken_intra_doc_links = "deny"
invalid_html_tags = "deny"
invalid_rust_codeblocks = "deny"
missing_crate_level_docs = "warn"
private_intra_doc_links = "warn"
redundant_explicit_links = "warn"
unescaped_backticks = "warn"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
# Public accessors and builders do not need a must_use annotation on every return value.
must_use_candidate = "allow"
# Domain names such as config/configs and request/response remain readable together.
similar_names = "allow"

# Keep functions small, matches exhaustive, and output deliberate
clone_on_ref_ptr = "warn"
cognitive_complexity = "warn"
exit = "warn"
infinite_loop = "warn"
print_stderr = "warn"
print_stdout = "warn"
redundant_clone = "warn"
shadow_unrelated = "warn"
wildcard_enum_match_arm = "warn"

# Prevent panics from unwraps and unsafe slicing or indexing
arithmetic_side_effects = "warn"
expect_used = "warn"
get_unwrap = "warn"
indexing_slicing = "warn"
panic = "warn"
panic_in_result_fn = "warn"
string_slice = "warn"
todo = "warn"
unimplemented = "warn"
unreachable = "warn"
unwrap_in_result = "warn"
unwrap_used = "warn"

# Prevent dropped futures and swallowed errors
assertions_on_result_states = "warn"
let_underscore_must_use = "warn"
map_err_ignore = "warn"
unused_result_ok = "warn"

# Prevent unsafe things with memory
mem_forget = "warn"
multiple_unsafe_ops_per_block = "warn"
undocumented_unsafe_blocks = "warn"
unnecessary_safety_comment = "warn"
unnecessary_safety_doc = "warn"

# Prevent potentially incorrect things with numbers
float_cmp_const = "warn"
lossy_float_literal = "warn"

# Don't Do Bad Things That are Easy to Avoid
dbg_macro = "warn"
debug_assert_with_mut_call = "warn"
infallible_try_from = "warn"
rc_mutex = "warn"

# Don't `allow` Your Way Around These Lints - every suppression must be
# a deliberate #[expect(..., reason = "…")] rather than a silent #[allow]
allow_attributes = "warn"
allow_attributes_without_reason = "warn"

[profile.dev]
incremental = true # Compile your binary in smaller steps.

# https://tauri.app/concept/size/
[profile.release]
codegen-units = 1 # Allows LLVM to perform better optimization.
lto = true # Enables link-time-optimizations.
opt-level = "s" # Prioritizes small binary size. Use `3` if you prefer speed.
panic = "abort" # Higher performance by disabling panic handlers.
strip = true # Ensures debug symbols are removed.
